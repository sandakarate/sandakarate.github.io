name: Update Blog Posts

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # 毎日0時・6時・12時・18時（UTC）に実行
  workflow_dispatch:  # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Fetch Ameblo RSS and update HTML
        run: |
          python3 << 'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import re

          # RSSを取得
          url = 'https://ameblo.jp/sanda-karate/rss20.xml'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req, timeout=10) as res:
                  xml_data = res.read()
          except Exception as e:
              print(f"RSS取得失敗: {e}")
              exit(0)

          # XMLをパース
          root = ET.fromstring(xml_data)
          ns = {'content': 'http://purl.org/rss/1.0/modules/content/'}
          items = root.findall('.//item')[:5]

          if not items:
              print("記事が見つかりません")
              exit(0)

          # HTML生成
          html = '<div style="display:flex;flex-direction:column;gap:0.75rem;">'
          for item in items:
              title = item.findtext('title', '')
              link = item.findtext('link', '#')
              pub = item.findtext('pubDate', '')
              try:
                  from datetime import datetime
                  date = datetime.strptime(pub[:25], '%a, %d %b %Y %H:%M:%S').strftime('%Y年%-m月%-d日')
              except:
                  date = ''

              html += f'''<a href="{link}" target="_blank" rel="noopener" style="
                  display:flex;justify-content:space-between;align-items:center;
                  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
                  border-radius:12px;padding:1rem 1.5rem;text-decoration:none;
                  transition:background 0.2s;gap:1rem;"
                onmouseover="this.style.background='rgba(255,255,255,0.12)'"
                onmouseout="this.style.background='rgba(255,255,255,0.06)'">
                <div style="display:flex;align-items:center;gap:0.75rem;overflow:hidden;">
                  <span style="color:#D93025;flex-shrink:0;">📝</span>
                  <span style="color:white;font-size:0.9rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{title}</span>
                </div>
                <span style="color:rgba(255,255,255,0.4);font-size:0.78rem;white-space:nowrap;flex-shrink:0;">{date}</span>
              </a>'''
          html += '</div>'

          # index.htmlを読み込んで差し替え
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          # blog-postsの中身を差し替え
          new_content = re.sub(
              r'(<div id="blog-posts"[^>]*>).*?(</div>)',
              f'\\1{html}\\2',
              content,
              flags=re.DOTALL
          )

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(new_content)

          print("index.html更新完了")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Update blog posts"
          git push
